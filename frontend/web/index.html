<!DOCTYPE html>
<html lang="de">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PubScout - Finde Bars & Kneipen mit Darts, Billard, Kicker und mehr auf einer interaktiven Karte.">
  <meta name="theme-color" content="#1B4332">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PubScout">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PubScout</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #1B4332;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
    }
    .loading img {
      width: 120px;
      height: 120px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    .loading-text {
      color: #FEFAE0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .loading-bar {
      width: 160px;
      height: 4px;
      background: rgba(254, 250, 224, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .loading-bar-inner {
      width: 40%;
      height: 100%;
      background: #D4A373;
      border-radius: 2px;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <img src="icons/Icon-192.png" alt="PubScout">
    <div class="loading-text">PubScout</div>
    <div class="loading-bar"><div class="loading-bar-inner"></div></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script>
    // Suppress the default blue Flutter loading indicator —
    // we show our own branded splash screen above.
    window.addEventListener('DOMContentLoaded', function() {
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          m.addedNodes.forEach(function(node) {
            if (node.shadowRoot) {
              var style = document.createElement('style');
              style.textContent = '.indeterminate { display: none !important; }';
              node.shadowRoot.appendChild(style);
              observer.disconnect();
            }
          });
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
