<!DOCTYPE html>
<html lang="de">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PubScout - Finde Bars & Kneipen mit Darts, Billard, Kicker und mehr auf einer interaktiven Karte.">
  <meta name="theme-color" content="#1B4332">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PubScout">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PubScout</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #1B4332;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
    }
    .loading img {
      width: 120px;
      height: 120px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    .loading-text {
      color: #FEFAE0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .loading-bar {
      width: 160px;
      height: 4px;
      background: rgba(254, 250, 224, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .loading-bar-inner {
      width: 40%;
      height: 100%;
      background: #D4A373;
      border-radius: 2px;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <img src="icons/Icon-192.png" alt="PubScout">
    <div class="loading-text">PubScout</div>
    <div class="loading-bar"><div class="loading-bar-inner"></div></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <!--
    Override the Flutter engine's built-in loading indicator by injecting CSS
    that hides it. The indicator lives inside a shadow root, so we need to
    watch for it and inject a <style> once it appears.
  -->
  <script>
    (function() {
      // Strategy 1: catch shadow roots added to body
      var mo = new MutationObserver(function(records) {
        for (var i = 0; i < records.length; i++) {
          for (var j = 0; j < records[i].addedNodes.length; j++) {
            var node = records[i].addedNodes[j];
            if (node.nodeType === 1) { hideInShadow(node); }
          }
        }
      });
      mo.observe(document.body, { childList: true, subtree: true });

      function hideInShadow(el) {
        // Check the element itself and its descendants for shadow roots
        try {
          if (el.shadowRoot) { injectHide(el.shadowRoot); }
        } catch(e) {}
        // Also handle flt-glass-pane and flutter-view elements
        if (el.tagName && (el.tagName.includes('-') || el.tagName === 'FLUTTER-VIEW')) {
          // Observe for shadow root attachment
          var so = new MutationObserver(function() {
            if (el.shadowRoot) { injectHide(el.shadowRoot); so.disconnect(); }
          });
          so.observe(el, { childList: true });
          // Also try after a tick
          setTimeout(function() {
            if (el.shadowRoot) { injectHide(el.shadowRoot); }
            so.disconnect();
          }, 50);
        }
      }

      function injectHide(shadowRoot) {
        var s = document.createElement('style');
        s.textContent = '.indeterminate, .loading-indicator { display:none!important; height:0!important; }';
        shadowRoot.appendChild(s);
      }

      // Strategy 2: brute-force hide any top-level element that looks like a loader
      var interval = setInterval(function() {
        document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function(el) {
          if (el.shadowRoot) {
            injectHide(el.shadowRoot);
            clearInterval(interval);
            mo.disconnect();
          }
        });
      }, 100);

      // Clean up after 10 seconds regardless
      setTimeout(function() { clearInterval(interval); mo.disconnect(); }, 10000);
    })();
  </script>
</body>
</html>
